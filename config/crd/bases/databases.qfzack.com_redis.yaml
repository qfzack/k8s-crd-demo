                - standalone
                - sentinel
                - cluster
                type: string
              monitor:
                description: Monitoring configuration
                properties:
                  enabled:
                    description: Enable Promutheus monitoring
                    type: boolean
                  port:
                    description: Prometheus service port
                    format: int32
                    type: integer
                type: object
              name:
                description: Name is the part of pod name
                type: string
              port:
