name: Build and Push Helm Chart

on:
  push:
    tags:
      - '*'
    branches:
      - redis-operator
    paths:
      - config/**
      - .github/workflows/helm-chart-build.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Install helmify
      run: |
        curl -LO https://github.com/arttor/helmify/releases/latest/download/helmify_Linux_x86_64.tar.gz
        tar -zxvf helmify_Linux_x86_64.tar.gz
        chmod +x helmify
        sudo mv helmify /usr/local/bin/

    - name: Set up Helm
      uses: azure/setup-helm@v3

    - name: Build Helm chart
      run: |
        kustomize build config/default | helmify redis-operator
        ls redis-operator

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@v1.7.0
      with:
        charts_dir: redis-operator
      env:
        CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
