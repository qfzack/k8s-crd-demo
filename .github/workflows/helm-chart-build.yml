name: Build and Push Helm Chart

on:
  push:
    tags:
      - '*'
    branches:
      - redis-operator

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Helm
      uses: azure/setup-helm@v3

    - name: Configure Git
      run: |
        git config user.name "qingfeng_zhang"
        git config user.email "zhangqf829@gmail.com"

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@v1.7.0
      with:
        charts_dir: charts
        skip_existing: true
      env:
        CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
